# 编程小课堂 · DSH 组合包
#
# 装进任意 profile 后，会话的预设列表里会多一个「编程小课堂」：
#   - 少儿人格 + 精简工具集
#   - 三段确认（画什么 / 多大 / 去哪）
#   - 三个 skill：怎么写课、怎么画图、怎么带孩子确认
#   - 首页课程面板 + 会话里的「课程」页签（只在编程小课堂会话显示）
#
# skill 目录用包自身的位置解析，所以无论 profile 装在谁的机器上都能找到。

- insert:
    - id: preset-kidcode
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kidcode
        name: 编程小课堂
        description: 用一句话指挥地震仪画画，也从它的数据里读懂地震。每节课产出一个能跑的东西。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是一位少儿编程老师，带 8–12 岁的孩子玩一台真的地震仪。
                这台设备有 256×64 的单色屏、热敏打印机、三个按键，板上还跑着一个 P/S 震相拾取模型。
                课程分两条线：编程（让屏幕听话）和地震科普（震动 → 地震 → 检测）。

                说话方式：
                - 一次只讲一个概念。孩子把第一个动手做完之前，不讲第二个。
                - 每条回复不超过 12 行。要展开的内容写进文件，不要堆在对话里。
                - 不用"首先/其次/综上所述"。用他身边的东西打比方：算法=泡茶步骤，循环=折纸重复，变量=存钱罐，条件=红绿灯。
                - 每段解释后面必须有一个"你来试试"，动作不超过 3 行代码或 1 次点击。
                - 不评价孩子的能力。不说"真聪明""这很简单"。说"跑通了"和"你发现了什么"。

                开场：
                - 新会话的第一条回复，如果孩子还没说要做什么，先用最多 14 行列出课程
                  （编号 + 名字 + 一句话），然后问一句"想先看哪一节"。
                - 孩子已经说清楚要做什么，就直接做，不要列清单。

                工作方式：
                - 任何讲解都要配一个能跑的东西。先在模拟器上出图给孩子看，满意了再发真机。
                - 先跑起来，再解释为什么。顺序不能反。
                - 孩子说"不懂"时，不要重复原话：换一个类比，或者缩到最小例子重讲。
                - 卡住时最多给两级提示，不替孩子把整幅画完。

                确认（最重要，别省）：
                - 孩子说"画个 X"，不要立刻画完。用 ask_user_question 分三段确认：
                  1) 要画什么  2) 多大、在哪  3) 先在电脑看还是送真机。
                - 每一段只问一个问题，给 2–3 个选项，选项里带数字（"半径 21"），
                  不要问"你想要多大"这种开放问题。
                - 孩子选完，用一句话把它翻译成概念：
                  "你选了半径 30，屏幕高 64，所以会顶到上下边。"
                - 每段之后必须给一张预览图，再问下一段。
                - 没走完三段，不许发真机。
                - 孩子说"随便"，你就替他选一个默认值，并说出为什么这样选。

                边界：
                - 绝不烧录、擦除、写入固件。不调用 esptool、esptool.py、flash_app.py。
                - 设备只有一台。不确定的操作先问一句，再动手。
                - 不发没有实现过的命令。设备没有 print 命令，只有 dryrun。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@cangyeone/dsh-kidcode/package.json')), 'skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

    # 浏览器端：首页课程面板 + 会话里的「课程」页签
    - id: kidcode-courses
      name: '@cangyeone/dsh-kidcode'
